apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: usermgmt-02230159
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: usermgmt-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
