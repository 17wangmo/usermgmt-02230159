apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: usermgmt-02230159
spec:
  ingressClassName: nginx        # use "traefik" if you enabled the traefik add-on
  rules:
    - host: usermgmt-02230159.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
